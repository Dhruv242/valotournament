apiVersion: apps/v1
kind: Deployment
metadata:
  name: val-backend
  namespace: val
  labels:
    app: val-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: val-backend
  template:
    metadata:
      labels:
        app: val-backend
    spec:
      # Pod-level security defaults
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # `node` user in node:alpine
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      automountServiceAccountToken: false  # backend doesn't need to talk to k8s api

      containers:
        - name: val-backend
          image: 219865458704.dkr.ecr.ap-south-1.amazonaws.com/devops-testing:val-v1-55
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
              name: http

          # Container-level security context — defense in depth
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # /tmp needs to be writable since readOnlyRootFilesystem is on
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          envFrom:
            # All secrets come from the K8s Secret — never from YAML in git
            - secretRef:
                name: val-backend-secrets

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File

      volumes:
        - name: tmp
          emptyDir: {}

      restartPolicy: Always
