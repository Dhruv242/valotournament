# Kubernetes Secret holding every sensitive value the backend needs.
# Apply with:  kubectl -n val apply -f secret.yaml
#
# IMPORTANT: do NOT commit this file with real values. The placeholders below
# are samples — replace them and keep the populated file out of git, or
# (better) manage with sealed-secrets / external-secrets / AWS Secrets Manager.
#
# To generate a fresh JWT secret:
#   openssl rand -base64 64
#
# Payments now go through direct UPI + UTR verification (no Razorpay).
# UPI_VPA is the VPA money is collected into — it appears in the QR code,
# so use a VPA you're okay being public.
