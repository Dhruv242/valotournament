# Frontend nginx — serves static files and applies security headers.
# All API traffic is sent directly from the browser to the backend host
# (see config.js apiBaseUrl), so we don't proxy here. CORS is enforced by
# the backend.

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------- Security headers ----------------------------------------
    # Strict Content Security Policy. Must be a single-line value — any
    # leading whitespace makes nginx-ingress reject the response as an
    # invalid upstream header (502).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://media.valorant-api.com; connect-src 'self' https://valorant-api.com https://api.valotournament.in; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "0" always;  # modern browsers, disable legacy filter

    # ---------- Gzip ----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Don't leak version
    server_tokens off;

    # ---------- Routing -------------------------------------------------
    # Health check — returned directly by nginx, no file on disk needed
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # SPA fallback — any unknown path returns index.html so client-side
    # routing (#dashboard, #my-squads, …) still works on a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the immutable-ish assets
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(js|css)$ {
        # The app is small — short cache so users get updates fast
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Hide hidden files (e.g. .git artifacts that escaped .dockerignore)
    location ~ /\. {
        deny all;
        return 404;
    }
}